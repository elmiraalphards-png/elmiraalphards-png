<!DOCTYPE html>
<html lang="id">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>.:: HOME ::.</title>
	<style>
        html {
            scroll-behavior: smooth;
        }
		* {
			margin: 0;
			padding: 0;
			box-sizing: border-box;
		}
		body {
            overflow-y: auto;
			background-color: transparent;
			padding-top: 50px;
		}
        
		/* HERO HEADER */
		.hero-section {
            display: flex;
            flex-direction: row;
            align-items: center;
            justify-content: space-between;
            width: 90%;
            max-width: 1200px;
            margin: 100px auto 40px auto;
            gap: 40px;
            padding: 0px 0;
        }

        /* Sisi Kiri */
        .hero-left {
            flex: 1.2;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            text-align: left;
        }
        .est-badge {
            color: #ffcccc;
            text-align: center;
            font-size: 1rem;
            letter-spacing: 15px;
            margin-bottom: 8px;
        }
		.hero-title {
            font-family: 'Elephant', serif;
            font-style: italic;
            font-size: 3.5rem;
            color: #ffffff;
            margin-bottom: 16px;
            line-height: 1.1;
        }
        .hero-desc {
            font-size: 1.1rem;
            color: rgba(255, 255, 255, 0.85);
            margin-bottom: 28px;
            line-height: 1.6;
            max-width: 500px;
        }

		/* MENU CATEGORY & EXPLORE BUTTON */
		.menu-explore-section {
			width: 95%;
			max-width: 1300px;
			margin: 0 auto 50px auto;
			background-color: #f35f5f73;
			border-radius: 45px;
			padding: 25px 30px;
			display: flex;
			justify-content: space-between;
			align-items: center;
			border: 1px solid rgba(241, 216, 184, 0.15);
		}
		.menu-info h2 {
			font-family:Georgia, 'Times New Roman', Times, serif;
			font-size: 1.4rem;
			color: #ffffff;
			margin-bottom: 5px;
		}
		.menu-info p {
			color: #ffffff;
			font-size: 1rem;
		}
        .category-title {
            font-family:'Times New Roman', Times, serif;
            text-align: left;
            font-size: 2.5rem;
            color: #ffffff;
            margin-bottom: 15px;
            text-shadow: 0 10px 30px rgba(0, 0, 0, 0.699);
            border-bottom: 1px solid rgba(241, 216, 184, 0.25);
            padding-bottom: 10px;
            max-width: 1300px;
            margin-left: auto;
            margin-right: auto;
            width: 97%;
        }

		/* Tombol Explore Menu */
        .btn-explore {
            display: inline-block;
            padding: 12px 28px;
            border: 2px solid #ffffff;
            background-color: #ebebeb;
            color: #8b0000;
            font-size: 1rem;
            font-weight: bold;
            text-decoration: none;
            border-radius: 30px;
            transition: all 0.3s ease;
            font-family: 'Arial';
        }
        .btn-explore:hover {
            background-color: #ffffff;
            color: #ce1313;
            transform: translateY(-2px);
        }

            /* Sisi Kanan */
        .hero-right {
            flex: 1.2;
            display: flex;
            justify-content: center;
            }
        .image-frame {
            width: 100%;
            max-width: 570px;
            height: 400px;
            border-radius: 28px;
            overflow: hidden;
            border: 1px solid rgba(255,255,255,0.1);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            }

        /* Responsif untuk Layar HP / Tablet */
        @media (max-width: 768px) {
        .hero-section {
            flex-direction: column;
            text-align: center;
        }  
        .hero-left {
            align-items: center;
            text-align: center;
        }
        .image-frame {
            height: 280px;
        }
        }
	</style>
</head>
<body>

	<!-- Hero Section Split Layout -->
    <section class="hero-section">
        <!-- Sisi Kiri: Teks & Tombol -->
        <div class="hero-left">
            <span class="est-badge">- EST 2026 -</span>
            <h1 class="hero-title">Alse Salt Bread</h1>
            <p class="hero-desc">
            Nikmati kelezatan roti garam autentik dengan bahan berkualitas terbaik, tekstur renyah di luar, dan lembut bermentega di dalam.
            </p>

            <!-- Tombol Explore Menu menggantikan Lorem Ipsum -->
            <a href="menu.html" class="btn-explore">Explore Menu</a>
        </div>

        <!-- Sisi Kanan: Gambar dengan Bingkai Melengkung -->
        <div class="hero-right">
            <div class="image-frame">
            <img src="st image/imagehomesb.jpg" alt="Alse Salt Bread">
        </div>
    </div>
    </section>
</body>
</html>
